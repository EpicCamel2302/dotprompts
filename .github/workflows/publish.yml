name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1
          node-version: "22.14"
          registry-url: https://registry.npmjs.org
          # Avoid stale cache on release publishes (npm trusted publishing guidance)
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Publish package for release tag
        # Auth via OIDC trusted publishing — no NPM_TOKEN.
        # Configure each package on npmjs.com → Trusted Publisher:
        #   GitHub Actions / EpicCamel2302 / dotprompts / publish.yml
        run: |
          tag="${GITHUB_REF_NAME}"
          case "$tag" in
            dot-prompts-v*)
              npm publish -w dot-prompts --access public
              ;;
            dot-prompts-pi-v*)
              npm publish -w @dot-prompts/pi --access public
              ;;
            dot-prompts-conformance-v*)
              npm publish -w @dot-prompts/conformance --access public
              ;;
            *)
              echo "Unrecognized release tag: $tag (expected dot-prompts-v*, dot-prompts-pi-v*, or dot-prompts-conformance-v*)"
              exit 1
              ;;
          esac
