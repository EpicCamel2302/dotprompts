name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Align with release-please: these prefixes are recognized; feat/fix bump.
          types: |
            feat
            fix
            perf
            revert
            docs
            chore
            test
            ci
            build
            refactor
            style
          requireScope: false
